# PRE-REQUISITO: configure no GitHub (Settings > Secrets > Actions):
#   - DOMAIN_PRODUCAO: seu dominio completo (ex: controllo.com.br)
#     Sem esse secret, o build do frontend embute localhost:8000 e o
#     sistema nao funciona em producao.
#   - (Opcional) SSH_PRIVATE_KEY, HOST_IP, HOST_USER para auto-deploy.

name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/controllo-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/controllo-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ secrets.DOMAIN_PRODUCAO }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/controllo-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/controllo-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

