# PostgreSQL 15 — tuning moderado para 8GB RAM compartilhados
# Container limitado a 1000MB via docker-compose mem_limit

shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB
max_connections = 100
wal_buffers = 8MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
min_wal_size = 80MB
max_wal_size = 1GB

# Logs concisos
log_min_duration_statement = 1000
log_line_prefix = '%t [%p] %u@%d '
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on

# Autovacuum
autovacuum = on
autovacuum_naptime = 60s
autovacuum_vacuum_cost_limit = 200
